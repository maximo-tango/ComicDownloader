<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Image Hunter</title>
  <link rel="icon" href="../icons/icon32.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="../icons/icon32.png" alt=""> Image Hunter</div>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-view="analyze" role="tab">페이지 이미지</button>
      <button class="tab" data-view="paste" role="tab">URL 직접 입력</button>
      <button class="tab" data-view="downloads" role="tab">다운로드 <span id="dlBadge" class="count" hidden></span></button>
    </nav>
    <div class="spacer"></div>
    <button id="openOptions" class="btn small">설정</button>
  </header>

  <main>
    <!-- ============ 페이지 이미지 ============ -->
    <section id="view-analyze" class="view">
      <div class="panel source-bar">
        <div class="page-info grow">
          <div id="pageTitle" class="page-title">분석할 페이지가 없습니다</div>
          <div id="pageUrl" class="page-url"></div>
        </div>
        <button id="btnScan" class="btn">다시 검색</button>
        <button id="btnScrollScan" class="btn" title="페이지를 아래로 스크롤해 지연 로딩 이미지를 불러온 뒤 추가로 찾습니다 (한 번에 최대 화면 수 제한)">스크롤하며 추가 검색</button>
        <div id="scanStatus" class="status-line" role="status"></div>
      </div>

      <div class="panel filters">
        <label class="field"><span>최소 너비</span><input id="fMinW" type="number" min="0" step="10" placeholder="0" inputmode="numeric"> px</label>
        <label class="field"><span>최소 높이</span><input id="fMinH" type="number" min="0" step="10" placeholder="0" inputmode="numeric"> px</label>
        <label class="field"><span>최소 파일 크기</span><input id="fMinSize" type="number" min="0" step="any" placeholder="0">
          <select id="fSizeUnit"><option value="1024">KB</option><option value="1048576">MB</option></select></label>
        <label class="field" title="파일 크기를 확인하지 못한 이미지를 최소 파일 크기 필터에서 어떻게 처리할지"><span>크기 확인 불가 항목</span>
          <select id="fUnknownSize"><option value="include">표시</option><option value="exclude">숨김</option></select></label>
        <div id="filterError" class="filter-error" role="alert"></div>
        <div class="field"><span>확장자</span><div id="fFormats" class="chips"></div></div>
        <div class="field"><span>원본 상태</span><div id="fStates" class="chips"></div></div>
        <label class="check"><input id="fNoThumb" type="checkbox"> 썸네일 의심 제외</label>
        <div class="field"><span>미리보기</span>
          <div class="segmented" role="radiogroup" aria-label="미리보기 크기">
            <button data-size="small" role="radio">작게</button><button data-size="medium" role="radio">중간</button><button data-size="large" role="radio">크게</button>
          </div></div>
      </div>

      <div class="panel selection-bar">
        <div id="countLine" class="count-line"></div>
        <div class="spacer"></div>
        <button id="btnSelectAll" class="btn small" title="필터로 숨겨진 항목까지 모두 선택">모두 선택</button>
        <button id="btnSelectNone" class="btn small">모두 해제</button>
        <button id="btnSelectVisible" class="btn small" title="지금 화면에 표시된 항목만 선택하고 숨겨진 항목은 해제">표시된 항목만 선택</button>
        <button id="btnMeasure" class="btn small" title="서버가 크기를 알려주지 않은 이미지를 실제로 받아 크기를 계산합니다">크기 확인</button>
        <button id="btnPdf" class="btn">PDF로 저장</button>
        <button id="btnDownload" class="btn primary">선택 다운로드</button>
      </div>

      <div id="pdfPanel" class="panel pdf-panel" hidden>
        <div id="pdfStatus" class="grow"></div>
        <div class="progress grow"><div id="pdfBar"></div></div>
        <button id="pdfCancel" class="btn small">취소</button>
        <ul id="pdfSkipped" class="invalid-list"></ul>
      </div>

      <p class="hint keys">키보드: 방향키로 항목 이동 · Space 선택 · Enter 원본을 새 탭에서 열기</p>
      <div id="grid" class="grid size-medium" role="listbox" aria-multiselectable="true" aria-label="이미지 목록"></div>
      <div id="emptyMsg" class="empty" hidden></div>
    </section>

    <!-- ============ URL 직접 입력 ============ -->
    <section id="view-paste" class="view" hidden>
      <div class="panel paste-input">
        <textarea id="pasteText" spellcheck="false" placeholder="이미지 URL을 한 줄에 하나씩 붙여넣으세요. 입력한 순서대로 저장됩니다.&#10;https://example.com/images/photo1.jpg&#10;https://example.com/images/photo2.png  원하는파일명.png&#10;&#10;URL 뒤에 공백을 두고 파일명을 적으면 그 이름으로 저장합니다. # 으로 시작하는 줄은 무시합니다."></textarea>
        <div class="paste-options">
          <label class="btn small file-btn">TXT/CSV 불러오기<input id="pasteImport" type="file" accept=".txt,.csv,text/plain,text/csv" hidden></label>
          <label class="field"><span>하위 폴더</span><input id="pasteFolder" type="text" placeholder="직접 입력" maxlength="80"></label>
          <div class="spacer"></div>
          <button id="btnPasteParse" class="btn primary">목록 확인</button>
        </div>
        <div id="pasteSummary" class="status-line"></div>
        <ul id="pasteInvalid" class="invalid-list"></ul>
      </div>
      <div class="panel selection-bar" id="pasteActions" hidden>
        <div id="pasteCount" class="count-line"></div>
        <div class="spacer"></div>
        <button id="pasteSelectAll" class="btn small">모두 선택</button>
        <button id="pasteSelectNone" class="btn small">모두 해제</button>
        <button id="pasteRetry" class="btn small">실패 항목 재시도</button>
        <button id="pasteExportFailed" class="btn small">실패 목록 내보내기</button>
        <button id="pasteExportTxt" class="btn small">목록 TXT</button>
        <button id="pasteExportCsv" class="btn small">목록 CSV</button>
        <button id="pastePdf" class="btn">PDF로 저장</button>
        <button id="pasteDlAll" class="btn">전체 다운로드</button>
        <button id="pasteDlSel" class="btn primary">선택 다운로드</button>
      </div>
      <div class="table-wrap">
        <table id="pasteTable" class="table" hidden>
          <thead><tr><th class="c-check"><input id="pasteCheckAll" type="checkbox" aria-label="모두 선택"></th><th>#</th><th>미리보기</th><th>URL</th><th>확인 결과</th><th>파일명</th><th>다운로드</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- ============ 다운로드 ============ -->
    <section id="view-downloads" class="view" hidden>
      <div class="panel selection-bar">
        <div id="dlSummary" class="count-line"></div>
        <div class="spacer"></div>
        <button id="dlRetryFailed" class="btn small">실패 항목 재시도</button>
        <button id="dlCancelAll" class="btn small">전체 취소</button>
        <button id="dlClear" class="btn small">완료·취소 항목 정리</button>
        <button id="dlExportCsv" class="btn small">결과 CSV</button>
        <button id="dlExportJson" class="btn small">결과 JSON</button>
        <button id="dlExportFailed" class="btn small">실패 URL 목록</button>
        <button id="dlOpenFolder" class="btn small">다운로드 폴더 열기</button>
      </div>
      <div class="table-wrap">
        <table class="table" id="dlTable">
          <thead><tr><th>#</th><th>파일</th><th>출처</th><th>상태</th><th class="c-progress">진행률</th><th>오류</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div id="dlEmpty" class="empty">다운로드 기록이 없습니다.</div>
    </section>
  </main>

  <div id="toast" class="toast" hidden role="status"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
