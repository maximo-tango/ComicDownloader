<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Image Hunter</title>
  <link rel="icon" href="../icons/icon32.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="../icons/icon32.png" alt=""> Image Hunter</div>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-view="analyze" role="tab">페이지 분석</button>
      <button class="tab" data-view="paste" role="tab">URL 붙여넣기</button>
      <button class="tab" data-view="downloads" role="tab">다운로드 <span id="dlBadge" class="count" hidden></span></button>
      <button class="tab" data-view="settings" role="tab">설정</button>
    </nav>
  </header>

  <main>
    <!-- ============ 페이지 분석 ============ -->
    <section id="view-analyze" class="view">
      <div class="panel source-bar">
        <label class="field grow">
          <span>분석할 탭</span>
          <select id="tabSelect"></select>
        </label>
        <button id="btnScan" class="btn">다시 탐색</button>
        <button id="btnScrollScan" class="btn" title="페이지를 끝까지 스크롤해 지연 로딩 이미지를 불러온 뒤 다시 찾습니다">스크롤 후 재탐색</button>
        <div id="scanStatus" class="status-line"></div>
      </div>

      <div class="panel filters">
        <label class="field"><span>최소 너비</span><input id="fMinW" type="number" min="0" step="10" placeholder="0"> px</label>
        <label class="field"><span>최소 높이</span><input id="fMinH" type="number" min="0" step="10" placeholder="0"> px</label>
        <label class="field"><span>최소 파일 크기</span><input id="fMinSize" type="number" min="0" step="any" placeholder="0">
          <select id="fSizeUnit"><option value="1024">KB</option><option value="1048576">MB</option></select></label>
        <label class="check" title="파일 크기를 확인하지 못한 이미지를 최소 크기 필터에서 통과시킬지 여부"><input id="fUnknownSize" type="checkbox" checked> 크기 미확인 포함</label>
        <div class="field formats"><span>형식</span><div id="fFormats" class="chips"></div></div>
        <label class="check"><input id="fNoThumb" type="checkbox"> 썸네일 의심 제외</label>
        <label class="check"><input id="fUnsure" type="checkbox"> 확인 필요만</label>
        <label class="field"><span>정렬</span><select id="sortKey"></select></label>
        <button id="sortDir" class="btn small" data-dir="asc" title="정렬 방향">오름차순 ↑</button>
      </div>

      <div class="panel selection-bar">
        <div id="countLine" class="count-line"></div>
        <div class="spacer"></div>
        <button id="btnSelectAll" class="btn small">모두 선택</button>
        <button id="btnSelectNone" class="btn small">모두 해제</button>
        <button id="btnSelectFiltered" class="btn small" title="현재 필터에 보이는 항목만 선택하고 나머지는 해제">필터 결과만 선택</button>
        <button id="btnMeasure" class="btn small" title="서버가 크기를 알려주지 않은 이미지를 실제로 받아 크기를 계산합니다">미확인 크기 측정</button>
        <button id="btnViewer" class="btn small">순차 보기 ▶</button>
        <button id="btnDownload" class="btn primary">선택 다운로드</button>
      </div>

      <div id="grid" class="grid"></div>
      <div id="emptyMsg" class="empty" hidden></div>
    </section>

    <!-- ============ URL 붙여넣기 ============ -->
    <section id="view-paste" class="view" hidden>
      <div class="panel paste-input">
        <textarea id="pasteText" spellcheck="false" placeholder="이미지 URL을 한 줄에 하나씩 붙여넣으세요.&#10;https://example.com/images/photo1.jpg&#10;https://example.com/images/photo2.png  원하는파일명.png&#10;&#10;URL 뒤에 공백을 두고 파일명을 적으면 그 이름으로 저장합니다. # 으로 시작하는 줄은 무시합니다."></textarea>
        <div class="paste-options">
          <label class="field grow"><span>Referer (선택)</span><input id="pasteReferer" type="url" placeholder="비워두면 각 이미지 사이트의 주소를 사용"></label>
          <label class="field"><span>하위 폴더 (선택)</span><input id="pasteFolder" type="text" placeholder="예: 모음집"></label>
          <button id="btnPasteParse" class="btn primary">목록 확인</button>
        </div>
        <div id="pasteSummary" class="status-line"></div>
        <ul id="pasteInvalid" class="invalid-list"></ul>
      </div>
      <div class="panel selection-bar" id="pasteActions" hidden>
        <div id="pasteCount" class="count-line"></div>
        <div class="spacer"></div>
        <button id="pasteSelectAll" class="btn small">모두 선택</button>
        <button id="pasteSelectNone" class="btn small">모두 해제</button>
        <button id="pasteRetry" class="btn small">실패 항목 재시도</button>
        <button id="pasteExport" class="btn small">실패 목록 내보내기</button>
        <button id="pasteDlAll" class="btn">전체 다운로드</button>
        <button id="pasteDlSel" class="btn primary">선택 다운로드</button>
      </div>
      <div class="table-wrap">
        <table id="pasteTable" class="table" hidden>
          <thead><tr><th class="c-check"><input id="pasteCheckAll" type="checkbox"></th><th>미리보기</th><th>URL</th><th>확인 결과</th><th>파일명</th><th>다운로드</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- ============ 다운로드 ============ -->
    <section id="view-downloads" class="view" hidden>
      <div class="panel selection-bar">
        <div id="dlSummary" class="count-line"></div>
        <div class="spacer"></div>
        <button id="dlRetryFailed" class="btn small">실패 항목 재시도</button>
        <button id="dlCancelAll" class="btn small">대기·진행 중 취소</button>
        <button id="dlClear" class="btn small">완료·취소 항목 정리</button>
        <button id="dlExport" class="btn small">실패 목록 내보내기</button>
        <button id="dlOpenFolder" class="btn small">다운로드 폴더 열기</button>
      </div>
      <div class="table-wrap">
        <table class="table" id="dlTable">
          <thead><tr><th>파일</th><th>상태</th><th class="c-progress">진행률</th><th>오류</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div id="dlEmpty" class="empty">다운로드 기록이 없습니다.</div>
    </section>

    <!-- ============ 설정 ============ -->
    <section id="view-settings" class="view" hidden>
      <div class="panel settings">
        <h2>저장 위치</h2>
        <label class="field"><span>기본 폴더 (다운로드 폴더 기준)</span><input id="sRoot" type="text"></label>
        <label class="check"><input id="sPerSite" type="checkbox"> 사이트별 하위 폴더에 저장 (예: Image Hunter/example.com/)</label>
        <label class="field"><span>같은 이름의 파일이 이미 있을 때</span>
          <select id="sConflict">
            <option value="uniquify">덮어쓰지 않고 새 이름으로 저장 (권장)</option>
            <option value="overwrite">기존 파일 덮어쓰기</option>
          </select></label>
        <h2>다운로드</h2>
        <label class="field"><span>동시 다운로드 수</span><input id="sConcurrency" type="number" min="1" max="8"></label>
        <label class="check"><input id="sReferer" type="checkbox"> 이미지 요청에 원래 페이지 주소를 Referer로 지정 (외부 링크 차단 사이트 대응)</label>
        <h2>원본 판별</h2>
        <label class="field"><span>썸네일로 간주할 최대 변 길이</span><input id="sThumb" type="number" min="16" step="10"> px</label>
        <label class="check"><input id="sAutoSkip" type="checkbox"> 순차 보기에서 불러오지 못한 이미지는 자동으로 건너뛰기</label>
        <div id="settingsSaved" class="status-line"></div>
      </div>
    </section>
  </main>

  <!-- ============ 순차 뷰어 ============ -->
  <div id="viewer" class="viewer" hidden role="dialog" aria-label="원본 이미지 뷰어">
    <div class="v-top">
      <strong id="vCounter"></strong>
      <span id="vStatus" class="badge"></span>
      <div class="spacer"></div>
      <label class="check"><input id="vNoThumb" type="checkbox"> 썸네일 의심 제외</label>
      <label class="check"><input id="vAutoSkip" type="checkbox"> 실패 시 자동 건너뛰기</label>
      <button id="vClose" class="btn small" title="닫기 (Esc)">닫기 ✕</button>
    </div>
    <div id="vStage" class="v-stage">
      <img id="vImg" alt="">
      <div id="vLoading" class="v-msg" hidden>불러오는 중…</div>
      <div id="vError" class="v-msg error" hidden>
        <p>이미지를 불러오지 못했습니다.</p>
        <button id="vErrNext" class="btn">다음 이미지로 →</button>
      </div>
    </div>
    <div class="v-info">
      <div id="vDims" class="v-dims"></div>
      <div id="vName" class="v-name"></div>
      <a id="vUrl" class="v-url" target="_blank" rel="noreferrer"></a>
      <details id="vCandidates"><summary>원본 후보</summary><ol></ol></details>
    </div>
    <div class="v-nav">
      <button id="vPrev" class="btn">← 이전</button>
      <label class="btn check-btn"><input id="vSelect" type="checkbox"> 선택</label>
      <button id="vDownload" class="btn primary">이 이미지 다운로드</button>
      <button id="vNext" class="btn">다음 →</button>
    </div>
    <div class="v-hint">← → 이동 · Space 선택 · D 다운로드 · F 실제 크기/맞춤 · Esc 닫기</div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
